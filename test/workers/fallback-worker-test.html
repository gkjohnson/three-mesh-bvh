<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
</head>
<body>
	<script type="module">
		import * as THREE from 'three';
		import { MeshBVH } from 'three-mesh-bvh';

		// load the workers from another origin, like a CDN, so they have to use the bundled fallback
		import { ParallelMeshBVHWorker, GenerateMeshBVHWorker } from 'http://127.0.0.1:3001/src/workers/index.js';

		window.THREE = THREE;
		window.MeshBVH = MeshBVH;
		window.ParallelMeshBVHWorker = ParallelMeshBVHWorker;
		window.GenerateMeshBVHWorker = GenerateMeshBVHWorker;
	</script>
</body>
</html>
